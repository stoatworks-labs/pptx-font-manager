<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerPoint Font Manager</title>
    <meta
      name="description"
      content="Scan a PowerPoint deck for the fonts it actually uses, check which are installed, and build a sidecar font bundle."
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Tints the status bar when installed. Two, so it follows the theme. -->
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
