# Keeps dependencies current across the fleet.
#
# Minor and patch bumps are grouped into a single PR per ecosystem per week, so
# routine drift costs one review rather than twenty. Majors still arrive as
# their own PRs, because they need reading.
#
# Deliberately no `ignore:` rules — an ignore also suppresses the *security*
# update for that dependency, which is exactly the PR worth having.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The desktop port's crates. Dependabot will not find these from the root —
  # a Tauri project needs its own entry pointing at /src-tauri, because that is
  # where Cargo.toml lives and there is none at the repo root.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
